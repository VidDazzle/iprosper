name: Deploy to Cloudflare Workers

# Push-to-deploy for Cloudflare Workers. Runs on pushes to main and on manual
# dispatch. It deploys only when the Cloudflare secrets are configured, and
# skips cleanly (green) otherwise — so it never shows a false failure.
#
# One-time setup — add these repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   (Workers Scripts:Edit permission)
#   CLOUDFLARE_ACCOUNT_ID
# App runtime env vars (SESSION_SECRET, TURSO_*, ADMIN_*, etc.) are set on the
# Worker itself in the Cloudflare dashboard or via `wrangler secret put`.
#
# To also auto-deploy a preview branch, add it under `branches` below.

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-${{ github.ref }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check Cloudflare secrets
        id: guard
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare secrets not set — skipping deploy. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to enable automatic deploys."
          fi

      - uses: actions/checkout@v4
        if: steps.guard.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.configured == 'true'
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci

      - name: Build & deploy (OpenNext → Workers)
        if: steps.guard.outputs.configured == 'true'
        run: npx opennextjs-cloudflare build && npx wrangler deploy
