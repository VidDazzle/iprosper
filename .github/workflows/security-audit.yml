name: Security Audit

# Regularly scans dependencies for newly disclosed vulnerabilities. Runs on a
# schedule (so new CVEs are caught even without a code change), on every push
# to the main branches, and on demand. This is the automated half of "updates
# regularly against new security threats" — Dependabot opens the fix PRs, this
# workflow flags what needs fixing.

on:
  schedule:
    - cron: "0 7 * * 1" # every Monday 07:00 UTC
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Fail the build on high/critical vulnerabilities so they can't ship.
      - name: Audit (high + critical)
        run: npm audit --audit-level=high

      # Full report (never fails) for visibility on lower-severity issues.
      - name: Full audit report
        if: always()
        run: npm audit || true
