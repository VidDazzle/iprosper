<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evolve — offline</title>
    <style>
      html, body { height: 100%; margin: 0; background: #0b0b0b; color: #e5e7eb; font-family: system-ui, sans-serif; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; }
      h1 { font-size: 1.4rem; margin: 12px 0 4px; }
      p { color: #9ca3af; margin: 0; }
      .dot { width: 10px; height: 10px; border-radius: 50%; background: #f59e0b; display: inline-block; margin-right: 6px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div><span class="dot"></span>You're offline</div>
      <h1>Evolve will reconnect automatically</h1>
      <p>Your encrypted data is safe. Reopen once you're back online.</p>
    </div>
  </body>
</html>
