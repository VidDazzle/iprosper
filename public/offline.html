<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline — Solvana</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #050810; color: #e2e8f0;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
  .card { max-width: 420px; }
  .mark { width: 64px; height: 64px; margin: 0 auto 24px; border-radius: 18px;
    background: linear-gradient(135deg,#22d3ee,#7c3aed); box-shadow: 0 0 40px rgba(34,211,238,.4); }
  h1 { font-size: 24px; margin: 0 0 10px; }
  p { color: #94a3b8; line-height: 1.6; }
  a { display: inline-block; margin-top: 20px; color: #22d3ee; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
  <div class="card">
    <div class="mark"></div>
    <h1>You&rsquo;re offline</h1>
    <p>Solvana can&rsquo;t reach the network right now. Your saved deposits and data are safe. Reconnect and try again &mdash; your AI agents keep working on your file in the background.</p>
    <a href="/portal" onclick="location.reload()">Retry</a>
  </div>
</body>
</html>
