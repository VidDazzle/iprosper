<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" fill="none" role="img" aria-label="Autonomous self-healing loop">
  <defs>
    <linearGradient id="al-g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38E4C9"/><stop offset=".5" stop-color="#FFC46B"/><stop offset="1" stop-color="#8B7BFF"/></linearGradient>
    <radialGradient id="al-node" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#fff" stop-opacity=".5"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <g transform="translate(180 180)">
    <circle r="128" fill="none" stroke="url(#al-g)" stroke-width="2" stroke-dasharray="5 8"/>
    <circle r="60" fill="none" stroke="url(#al-g)" stroke-width="1.5"/>
    <text y="-4" text-anchor="middle" font-family="ui-monospace,monospace" font-size="15" fill="#38E4C9" letter-spacing="2">CORE</text>
    <text y="18" text-anchor="middle" font-family="ui-monospace,monospace" font-size="11" fill="#8B7BFF">always on</text>
    <g font-family="ui-monospace,monospace" font-size="13" letter-spacing="1">
      <g><circle cx="0" cy="-128" r="14" fill="url(#al-node)"/><circle cx="0" cy="-128" r="7" fill="#38E4C9"/><text x="0" y="-150" text-anchor="middle" fill="#38E4C9">HEAL</text></g>
      <g><circle cx="128" cy="0" r="14" fill="url(#al-node)"/><circle cx="128" cy="0" r="7" fill="#FFC46B"/><text x="128" y="30" text-anchor="middle" fill="#FFC46B">OPTIMIZE</text></g>
      <g><circle cx="0" cy="128" r="14" fill="url(#al-node)"/><circle cx="0" cy="128" r="7" fill="#8B7BFF"/><text x="0" y="152" text-anchor="middle" fill="#8B7BFF">PATCH</text></g>
      <g><circle cx="-128" cy="0" r="14" fill="url(#al-node)"/><circle cx="-128" cy="0" r="7" fill="#38E4C9"/><text x="-128" y="-24" text-anchor="middle" fill="#38E4C9">AUDIT</text></g>
    </g>
  </g>
</svg>
