<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Orbital signal field">
  <defs>
    <radialGradient id="hof-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38E4C9"/>
      <stop offset="55%" stop-color="#8B7BFF"/>
      <stop offset="100%" stop-color="#8B7BFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hof-ring" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#38E4C9"/><stop offset=".5" stop-color="#FFC46B"/><stop offset="1" stop-color="#8B7BFF"/>
    </linearGradient>
    <radialGradient id="hof-node" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38E4C9"/><stop offset="100%" stop-color="#38E4C9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g transform="translate(320 200)">
    <ellipse rx="290" ry="150" stroke="url(#hof-ring)" stroke-opacity=".18" stroke-width="1.5"/>
    <ellipse rx="220" ry="115" stroke="url(#hof-ring)" stroke-opacity=".3" stroke-width="1.5" stroke-dasharray="4 9"/>
    <ellipse rx="150" ry="78" stroke="url(#hof-ring)" stroke-opacity=".5" stroke-width="1.5"/>
    <circle r="46" fill="url(#hof-core)" opacity=".9"/>
    <circle r="30" fill="none" stroke="url(#hof-ring)" stroke-width="1.5"/>
    <circle r="9" fill="#fff" opacity=".9"/>
    <!-- orbiting nodes with halos -->
    <g><circle cx="290" cy="0" r="18" fill="url(#hof-node)"/><circle cx="290" cy="0" r="5" fill="#38E4C9"/></g>
    <g><circle cx="-155" cy="66" r="16" fill="url(#hof-node)"/><circle cx="-155" cy="66" r="4.5" fill="#FFC46B"/></g>
    <g><circle cx="120" cy="-70" r="16" fill="url(#hof-node)"/><circle cx="120" cy="-70" r="4.5" fill="#8B7BFF"/></g>
    <g><circle cx="-210" cy="-40" r="13" fill="url(#hof-node)"/><circle cx="-210" cy="-40" r="4" fill="#38E4C9"/></g>
    <g><circle cx="60" cy="112" r="13" fill="url(#hof-node)"/><circle cx="60" cy="112" r="4" fill="#8B7BFF"/></g>
  </g>
  <!-- scattered stars -->
  <g fill="#38E4C9">
    <circle cx="70" cy="60" r="2.5" opacity=".7"/><circle cx="588" cy="330" r="2.5" opacity=".7"/>
    <circle cx="560" cy="70" r="2" opacity=".5"/><circle cx="90" cy="340" r="2" opacity=".5"/>
  </g>
  <g fill="#FFC46B"><circle cx="470" cy="40" r="2" opacity=".6"/><circle cx="150" cy="150" r="1.8" opacity=".5"/></g>
  <g fill="#8B7BFF"><circle cx="40" cy="220" r="2" opacity=".6"/><circle cx="610" cy="180" r="1.8" opacity=".5"/></g>
</svg>
