<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300" fill="none" role="img" aria-label="Profit above margin floor">
  <defs>
    <linearGradient id="pf-bar" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#12907E"/><stop offset="1" stop-color="#38E4C9"/></linearGradient>
    <linearGradient id="pf-floor" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FFC46B" stop-opacity=".2"/><stop offset=".5" stop-color="#FFC46B"/><stop offset="1" stop-color="#FFC46B" stop-opacity=".2"/></linearGradient>
  </defs>
  <!-- margin floor -->
  <line x1="30" y1="210" x2="410" y2="210" stroke="url(#pf-floor)" stroke-width="2.5" stroke-dasharray="7 6"/>
  <text x="30" y="200" font-family="ui-monospace,monospace" font-size="11" fill="#FFC46B">MARGIN FLOOR</text>
  <!-- rising bars, all above floor -->
  <g fill="url(#pf-bar)">
    <rect x="60" y="180" width="34" height="30" rx="5"/>
    <rect x="118" y="150" width="34" height="60" rx="5"/>
    <rect x="176" y="120" width="34" height="90" rx="5"/>
    <rect x="234" y="96" width="34" height="114" rx="5"/>
    <rect x="292" y="70" width="34" height="140" rx="5"/>
    <rect x="350" y="44" width="34" height="166" rx="5"/>
  </g>
  <!-- trend arrow -->
  <path d="M70 168 L135 138 L193 108 L251 84 L309 58 L372 34" fill="none" stroke="#38E4C9" stroke-width="2" stroke-opacity=".7"/>
  <path d="M360 30 L378 30 L378 48" fill="none" stroke="#38E4C9" stroke-width="2" stroke-opacity=".7" stroke-linecap="round"/>
  <line x1="30" y1="250" x2="410" y2="250" stroke="#8494A8" stroke-opacity=".3"/>
</svg>
